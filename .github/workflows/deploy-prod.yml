name: Deploy Client to Production

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Vite inlines VITE_* at build time — nginx cannot fix a wrong value later. Without
        # these, config.ts falls back to http://localhost:5000/api/v1 and the deployed app
        # calls the visitor's own machine. "/api/v1" is relative on purpose: nginx serves the
        # client and proxies /api/ to the server, so the app is same-origin and there is no
        # CORS preflight (same reason the dev server proxies — see vite.config.ts).
        env:
          VITE_API_URL: /api/v1
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: npm run build

      - name: Deploy PWA
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.ELNINO_GITHUB_DEPLOY }}
          source: "dist/*"
          target: "/var/www/elnino"
          strip_components: 1
          overwrite: true